# Local development services. The engine itself runs on the host so it can use
# the Apple GPU (MPS); Docker on macOS cannot.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chatcore
      POSTGRES_PASSWORD: chatcore-local-only
      POSTGRES_DB: chatcore
    ports:
      - "127.0.0.1:${CHATCORE_DB_PORT:-5432}:5432"  # set CHATCORE_DB_PORT if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatcore -d chatcore"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
