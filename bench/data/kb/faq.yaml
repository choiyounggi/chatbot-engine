# Synthetic FAQ for the fictional weather app 맑음노트 (knowledge-base measurement, E-D).
faq:
- id: faq_001
  question: 로그인이 안 돼요
  answer: 이메일과 비밀번호를 다시 확인하고, 구글/애플 소셜로그인을 쓰셨다면 해당 앱의 로그인 상태도 확인해 주세요. 계속 안 되면 설정 > 고객센터에서 문의할 수 있습니다.
- id: faq_002
  question: 비밀번호를 잊어버렸어요
  answer: 로그인 화면의 '비밀번호 찾기'에서 가입 이메일로 재설정 링크를 받을 수 있습니다. 링크 유효 시간은 발송 후 30분입니다.
- id: faq_003
  question: 가입한 이메일을 변경하고 싶어요
  answer: 설정 > 계정 > 이메일 변경에서 새 이메일로 바꿀 수 있습니다. 변경 완료 시 기존 이메일로 변경 알림이 발송됩니다.
- id: faq_004
  question: 구글 계정으로 가입했는데 로그인이 안 돼요
  answer: 설정 > 계정 > 연결된 계정에서 구글 연동이 해제되지 않았는지 확인해 주세요. 연동이 끊긴 경우 같은 구글 계정으로 다시 연결하면 복구됩니다.
- id: faq_005
  question: 다른 기기에서도 같은 계정으로 쓸 수 있나요
  answer: 네, 로그인만 하면 즐겨찾기 지역과 알림 설정이 자동으로 동기화됩니다. 최대 3대 기기까지 동시 로그인을 지원합니다.
- id: faq_006
  question: 소셜로그인 연결을 끊고 싶어요
  answer: 설정 > 계정 > 연결된 계정에서 해제할 수 있습니다. 단, 해제 후에는 비밀번호를 새로 설정해야 이메일 로그인이 가능합니다.
- id: faq_007
  question: 회원가입 시 이메일 인증이 안 와요
  answer: 스팸함을 먼저 확인해 주세요. 인증 메일은 발송 후 30분간 유효하며, 1분이 지나면 재발송 버튼이 활성화됩니다.
- id: faq_008
  question: 로그인한 상태에서 비밀번호를 바꾸고 싶어요
  answer: 설정 > 계정 > 비밀번호 변경에서 기존 비밀번호를 입력한 뒤 새 비밀번호로 바꿀 수 있습니다.
- id: faq_009
  question: 알림이 오지 않아요
  answer: 기기 설정에서 맑음노트의 알림 권한이 허용되어 있는지 먼저 확인해 주세요. 그다음 앱 내 설정 > 알림에서 항목별 스위치가 꺼져 있지 않은지 확인하면 됩니다.
- id: faq_010
  question: 비 올 때만 알림을 받고 싶어요
  answer: 설정 > 알림에서 '비 알림'만 켜고 나머지 알림을 끄면 됩니다. 비 알림은 강수 시작 10분 전에 발송됩니다.
- id: faq_011
  question: 미세먼지가 나쁠 때 알림을 받고 싶어요
  answer: 설정 > 알림에서 '미세먼지 알림'을 켜면 됩니다. PM10 또는 PM2.5가 '나쁨' 이상으로 예상되는 날 오전 7시에 하루 1회 발송됩니다.
- id: faq_012
  question: 기상특보 알림을 끄고 싶어요
  answer: 기상특보 알림은 안전 공지이므로 끌 수 없습니다. 호우·강풍·대설·폭염·한파 특보가 발효되면 즉시 발송됩니다.
- id: faq_013
  question: 자외선 알림은 언제 오나요
  answer: 자외선 지수가 8 이상으로 예상되는 날 오전 9시에 하루 1회 발송됩니다.
- id: faq_014
  question: 알림 소리를 바꾸고 싶어요
  answer: 설정 > 알림 > 알림음에서 기본, 차임, 무음 세 가지 중 선택할 수 있습니다.
- id: faq_015
  question: 특정 지역만 알림을 받고 싶어요
  answer: 설정 > 알림 > 지역별 알림에서 등록된 지역마다 알림을 개별적으로 켜고 끌 수 있습니다.
- id: faq_016
  question: 밤에는 알림이 안 왔으면 해요
  answer: 설정 > 알림 > 방해금지 시간에서 예를 들어 22시부터 7시까지 알림을 막을 수 있습니다. 단 기상특보 알림은 방해금지 시간에도 발송됩니다.
- id: faq_017
  question: 맑음노트 플러스는 얼마인가요
  answer: 월 구독은 3,900원, 연 구독은 39,000원이며 연 구독은 2개월 무료 혜택이 포함된 가격입니다.
- id: faq_018
  question: 무료 체험이 있나요
  answer: 신규 구독자에게 7일 무료체험이 제공됩니다. 체험 종료 24시간 전에 안내 알림이 발송됩니다.
- id: faq_019
  question: 결제 수단은 무엇을 지원하나요
  answer: 앱스토어 또는 구글플레이의 인앱결제만 지원합니다. 카드나 상품권으로 앱 내에서 직접 결제할 수는 없습니다.
- id: faq_020
  question: 플러스 요금제는 뭐가 다른가요
  answer: 즐겨찾기 지역 10개 등록, 광고 제거, 초단기 강수 알림, 상세 대기질 리포트가 추가로 제공됩니다.
- id: faq_021
  question: 무료 요금제로는 지역을 몇 개까지 등록하나요
  answer: 무료 요금제는 3개, 플러스 요금제는 10개까지 등록할 수 있습니다.
- id: faq_022
  question: 월 구독을 연 구독으로 바꾸고 싶어요
  answer: 설정 > 구독 관리 > 요금제 변경에서 바꿀 수 있습니다. 변경 사항은 다음 결제일부터 적용됩니다.
- id: faq_023
  question: 구독료가 중복으로 결제됐어요
  answer: 맑음노트 내부에서는 중복 결제 내역을 확인할 수 없으므로, 결제한 스토어(앱스토어 또는 플레이스토어) 고객센터에 거래내역을 들고 문의해야 합니다.
- id: faq_024
  question: 가족과 요금제를 공유할 수 있나요
  answer: 공유는 지원하지 않습니다. 플러스 구독은 결제한 계정 1개에만 적용됩니다.
- id: faq_025
  question: 월 구독을 해지하면 환불되나요
  answer: 월 구독은 해지해도 이미 결제한 기간의 요금은 환불되지 않습니다. 대신 다음 결제일 전까지는 플러스 혜택이 그대로 유지됩니다.
- id: faq_026
  question: 연 구독 환불을 받고 싶어요
  answer: 연 구독은 결제일로부터 14일 이내에 신청하면 전액 환불이 가능합니다. 14일이 지나면 환불이 제한됩니다.
- id: faq_027
  question: 환불은 어디서 신청하나요
  answer: 설정 > 구독 관리 > 환불 신청에서 바로 신청하거나, 결제한 스토어의 고객센터를 통해 신청할 수 있습니다.
- id: faq_028
  question: 환불 신청 후 처리 기간은 얼마나 걸리나요
  answer: 스토어 승인 절차를 거쳐 영업일 기준 3~5일 정도 소요됩니다.
- id: faq_029
  question: 구독 해지와 환불의 차이가 뭔가요
  answer: 해지는 다음 결제를 막는 것이고, 환불은 이미 낸 금액을 돌려받는 것입니다. 환불은 연 구독에 한해 결제 후 14일 이내에만 가능합니다.
- id: faq_030
  question: 실수로 연 구독을 결제했어요 환불되나요
  answer: 결제 후 14일 이내라면 설정 > 구독 관리 > 환불 신청에서 전액 환불을 요청할 수 있습니다.
- id: faq_031
  question: 체험기간 중 해지하면 요금이 청구되나요
  answer: 무료체험 7일 이내에 해지하면 요금이 전혀 청구되지 않습니다.
- id: faq_032
  question: 플러스 요금제를 해지했는데 바로 광고가 보여요
  answer: 월 구독은 해지해도 다음 결제일 전까지는 혜택이 유지되어야 합니다. 즉시 광고가 보인다면 오류일 수 있으니 고객센터(support@example.com)로 문의해 주세요.
- id: faq_033
  question: 홈 화면에 위젯을 추가하는 방법
  answer: 홈 화면을 길게 눌러 위젯 추가 메뉴에서 맑음노트를 선택하고 2x2, 4x2, 4x4 중 원하는 크기를 고르면 됩니다.
- id: faq_034
  question: 위젯 크기별 차이가 뭔가요
  answer: 2x2는 현재 날씨만, 4x2는 1시간 예보까지, 4x4는 주간예보까지 함께 표시됩니다.
- id: faq_035
  question: 위젯이 업데이트되지 않아요
  answer: 위젯은 30분마다 자동으로 갱신됩니다. 바로 갱신하고 싶으면 위젯을 한 번 탭하면 즉시 새로고침됩니다.
- id: faq_036
  question: 위젯에 표시되는 지역을 바꾸고 싶어요
  answer: 위젯을 길게 눌러 위젯 편집에 들어간 뒤 지역 선택 항목에서 원하는 지역으로 바꿀 수 있습니다.
- id: faq_037
  question: 위젯 디자인(테마)을 바꿀 수 있나요
  answer: 위젯 편집 화면에서 라이트, 다크, 시스템 설정 중 하나를 테마로 고를 수 있습니다.
- id: faq_038
  question: 잠금화면에도 위젯을 추가할 수 있나요
  answer: iOS 16 이상에서 잠금화면 위젯을 지원하며, 현재 기온만 보여주는 소형 위젯이 제공됩니다.
- id: faq_039
  question: 위젯이 안드로이드에서 설치가 안 돼요
  answer: 안드로이드 10 미만 기기는 위젯 기능을 지원하지 않습니다.
- id: faq_040
  question: 위젯에 여러 지역을 동시에 표시할 수 있나요
  answer: 4x4 위젯에서만 즐겨찾기 지역 중 최대 3개를 번갈아 보여주는 기능을 지원합니다.
- id: faq_041
  question: 위치 권한을 꼭 허용해야 하나요
  answer: 현재 위치 기준 날씨를 자동으로 보려면 필요합니다. 거부해도 마지막으로 등록한 지역 기준으로 날씨를 볼 수 있습니다.
- id: faq_042
  question: 위치 권한을 거부했는데 날씨가 안 나와요
  answer: 설정 > 개인정보 > 위치에서 맑음노트 권한을 '앱 사용 중 허용'으로 바꿔 주세요.
- id: faq_043
  question: 지역을 추가하는 방법
  answer: 설정 > 지역 관리 > 지역 추가(+)에서 동, 읍, 면 단위까지 검색해 추가할 수 있습니다.
- id: faq_044
  question: 지역은 몇 개까지 등록할 수 있나요
  answer: 무료 요금제는 3개, 플러스 요금제는 10개까지 등록할 수 있습니다.
- id: faq_045
  question: 즐겨찾기 지역 순서를 바꾸고 싶어요
  answer: 지역 관리 화면에서 지역을 길게 눌러 드래그하면 순서를 바꿀 수 있습니다.
- id: faq_046
  question: 해외 지역도 등록할 수 있나요
  answer: 등록할 수 있지만 해외 지역은 3시간 간격으로 갱신되어 국내 지역보다 갱신 주기가 느립니다.
- id: faq_047
  question: 등록한 지역을 삭제하고 싶어요
  answer: 지역 관리 화면에서 지역을 왼쪽으로 스와이프하면 삭제 버튼이 나타납니다.
- id: faq_048
  question: 백그라운드 위치 권한은 왜 필요한가요
  answer: 앱을 꺼둔 상태에서도 지역 이동을 감지해 날씨 알림을 보내기 위해 사용되며, 선택 동의 사항입니다.
- id: faq_049
  question: 날씨 데이터는 어디서 가져오나요
  answer: 기상데이터 제공사 '스카이데이터랩'과 제휴해 받은 데이터를 사용합니다.
- id: faq_050
  question: 현재 날씨는 얼마나 자주 갱신되나요
  answer: 현재 날씨는 10분마다 자동으로 갱신됩니다.
- id: faq_051
  question: 일일 예보는 하루에 몇 번 갱신되나요
  answer: 일일 예보는 하루 4회, 02시·08시·14시·20시에 갱신됩니다.
- id: faq_052
  question: 주간 예보는 언제 갱신되나요
  answer: 주간 예보는 하루 1회, 오전 5시에 갱신됩니다.
- id: faq_053
  question: 예보가 실제 날씨와 다를 때가 있어요 왜 그런가요
  answer: 예보는 통계적 추정치라서 스카이데이터랩의 다음 갱신(최대 6시간 간격)까지는 실제와 차이가 날 수 있습니다.
- id: faq_054
  question: 초단기 강수 알림은 무슨 데이터를 쓰나요
  answer: 레이더 기반 초단기 예측 데이터를 사용해 1~2시간 이내의 강수 변화를 반영합니다.
- id: faq_055
  question: 대기질(미세먼지) 데이터 갱신 주기는 어떻게 되나요
  answer: 대기질 데이터는 1시간마다 갱신됩니다.
- id: faq_056
  question: 데이터가 오래된 것 같으면 어떻게 하나요
  answer: 화면을 아래로 당기면 즉시 최신 데이터를 다시 요청합니다.
- id: faq_057
  question: 맑음노트가 수집하는 개인정보는 무엇인가요
  answer: 동의 시 위치정보, 기기식별자, 앱 사용 로그를 수집합니다.
- id: faq_058
  question: 계정을 삭제(탈퇴)하고 싶어요
  answer: 설정 > 계정 > 회원 탈퇴에서 신청할 수 있으며, 처리까지 7일이 걸립니다.
- id: faq_059
  question: 탈퇴 후 데이터는 바로 삭제되나요
  answer: 탈퇴 신청 후 7일 이내에 개인정보가 삭제됩니다. 다만 결제 기록은 전자상거래법에 따라 5년간 별도 보관됩니다.
- id: faq_060
  question: 위치정보 수집에 동의하지 않으면 못 쓰나요
  answer: 동의하지 않아도 지역을 직접 등록해서 이용할 수 있습니다. 다만 현재 위치 자동 감지 기능만 제한됩니다.
- id: faq_061
  question: 개인정보 삭제를 별도로 요청하고 싶어요
  answer: support@example.com으로 삭제를 요청하면 접수 후 7일 이내에 처리됩니다.
- id: faq_062
  question: 제3자에게 데이터를 제공하나요
  answer: 스카이데이터랩에는 날씨 조회에 필요한 최소한의 위치정보만 제공하며, 광고주에게는 제공하지 않습니다.
- id: faq_063
  question: 미성년자도 가입할 수 있나요
  answer: 만 14세 이상부터 가입할 수 있으며, 만 14세 미만은 법정대리인 동의 절차가 필요합니다.
- id: faq_064
  question: 개인정보 처리방침은 어디서 볼 수 있나요
  answer: 설정 > 약관 및 정책 > 개인정보 처리방침에서 전체 내용을 확인할 수 있습니다.
- id: faq_065
  question: 앱이 자꾸 강제 종료돼요
  answer: 설정 > 저장공간 > 캐시 삭제 후 다시 실행해 보세요. 그래도 반복되면 앱을 삭제 후 재설치하는 것을 권장합니다.
- id: faq_066
  question: 캐시를 삭제하면 즐겨찾기 지역도 없어지나요
  answer: 아니요, 캐시를 삭제해도 즐겨찾기 지역 정보는 그대로 유지됩니다.
- id: faq_067
  question: 앱을 재설치하면 설정이 초기화되나요
  answer: 로그인한 계정 기준으로 클라우드에 동기화되어 있어 재설치 후 로그인하면 설정이 복구됩니다.
- id: faq_068
  question: 다크모드에서 글자가 안 보여요
  answer: 설정 > 화면 > 테마를 라이트로 바꿨다가 다시 다크로 전환하면 대부분 해결됩니다. 계속되면 재설치를 권장합니다.
- id: faq_069
  question: 글자가 깨져서 나와요
  answer: 기기의 커스텀 폰트와 충돌했을 가능성이 있습니다. 설정 > 화면에서 '기본 폰트 사용'으로 전환해 보세요.
- id: faq_070
  question: 오래된 기기에서 앱이 느려요
  answer: iOS 16, 안드로이드 10 미만 기기는 공식 지원이 종료되어 성능 저하가 발생할 수 있습니다.
- id: faq_071
  question: 앱 업데이트 후 로그인이 풀렸어요
  answer: 보안 정책상 메이저 업데이트 시 재로그인이 필요할 수 있습니다. 가입 시 사용한 계정으로 다시 로그인하면 됩니다.
- id: faq_072
  question: 위치가 다른 지역으로 잘못 잡혀요
  answer: 기기 위치 설정을 '정확한 위치'로 바꾼 뒤 앱을 재시작하면 대부분 해결됩니다.
- id: faq_073
  question: 체감온도가 뭔가요
  answer: 기온, 습도, 풍속을 반영해 맑음노트가 자체 계산한 값으로, 실제 기온과 최대 ±5도까지 차이가 날 수 있습니다.
- id: faq_074
  question: 강수확률은 어떻게 계산되나요
  answer: 향후 1시간 안에 1mm 이상의 비가 내릴 확률을 10% 단위로 표시한 값입니다.
- id: faq_075
  question: 미세먼지 등급 기준이 뭔가요
  answer: PM10 24시간 평균 기준으로 좋음 0~30, 보통 31~80, 나쁨 81~150, 매우나쁨 151 이상(㎍/㎥)으로 표시합니다.
- id: faq_076
  question: 초미세먼지는 미세먼지와 다른가요
  answer: 네, PM2.5를 기준으로 좋음 0~15, 보통 16~35, 나쁨 36~75, 매우나쁨 76 이상으로 별도 표시합니다.
- id: faq_077
  question: 자외선 지수는 어떻게 나뉘나요
  answer: 0~2는 낮음, 3~5는 보통, 6~7은 높음, 8~10은 매우높음, 11 이상은 위험으로 표시합니다.
- id: faq_078
  question: 황사는 언제 알려주나요
  answer: PM10 농도가 150㎍/㎥를 1시간 이상 초과할 것으로 예상될 때 황사 알림을 보냅니다.
- id: faq_079
  question: 풍속 단위는 무엇을 쓰나요
  answer: 초속(m/s) 단위로 풍속을 표시합니다.
- id: faq_080
  question: 습도는 몇 퍼센트부터 높다고 보나요
  answer: 맑음노트는 상대습도 70% 이상을 '습함'으로 표시합니다.
