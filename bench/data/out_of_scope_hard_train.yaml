  - "이사회 회의는 인사말 없이 바로 시작하는 게 보통인가요?"
  - "반려견 하이의 훈련은 몇 살부터 시작하는 게 좋을까요?"
  - "신입 교육에서 하이라고 경쾌하게 인사하는 방식도 괜찮을까요?"

  # bye (종료, 끝, 다음에, 가볼게, 잘 있어, 그만)
  - "게임 서버 점검이 종료되면 저장 안 된 데이터가 끝까지 복구되는지 알려줘."
  - "구독을 종료하면 다음에 재가입할 때도 예전 혜택을 받을 수 있는지 확인해줄 수 있어?"
  - "회의가 종료되면 바로 다음 미팅 장소로 가볼게, 지도에서 최단 경로 좀 찾아줘."
  - "전기 종료 신청을 하면 냉장고 음식이 잘 있을지 걱정되는데 안전하게 보관하는 방법 알려줘."
  - "정수기 렌탈을 종료하고 그만 쓰고 싶은데 위약금 계산하는 법 알려줘."
  - "이 드라마가 끝나고 다음에 나올 시즌 방영일을 찾아줄 수 있어?"
