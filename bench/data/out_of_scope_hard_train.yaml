  - "결혼 10주년 편지에 배우자 덕분이라는 감사 문구 좀 써줘."

  # compliment (똑똑, 최고, 친절, 잘하, 좋)
  - "우리 집 강아지가 훈련사님 말로는 또래보다 똑똑하고 최고로 영리하대, 어떤 품종이 보통 그래?"
