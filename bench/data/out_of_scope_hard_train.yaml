  - "강아지 이름을 하이로 지었는데 손님만 보면 너무 반가워해, 이거 괜찮은 거야?"
  - "다이어트를 처음 시작할 때 식단은 어떻게 짜야 돼?"
  - "신입사원이 처음 출근한 날 인사 발령 서류는 어디서 받아?"
