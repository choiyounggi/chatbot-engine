# Hard-negative out-of-scope training examples (keyword-pair method, Li et al. 2024).
# Written without seeing the bot's training or evaluation data (2026-11-06).
examples:
  # greeting (안녕, 반가워, 처음, 시작, 인사, 하이)
  - "반려동물 이름으로 안녕이랑 반가워 중에 뭐가 더 귀엽게 들려?"
  - "드라마 안녕은 처음 몇 화부터 몰입감이 생겨?"
